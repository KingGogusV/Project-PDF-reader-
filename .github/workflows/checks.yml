name: Reader checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-verification:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Chromium
            os: ubuntu-latest
            browser: chromium
          - name: macOS WebKit
            os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CI: 'true'
      E2E_BROWSER: ${{ matrix.browser }}
      # The shared config ignores this channel for non-Chromium engines.
      E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bound inactive Linux package downloads
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/99folio-ci-download-limits
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Prepare encrypted test fixture generator
        run: python -m pip install pypdf==6.10.0 cryptography==50.0.1
      - name: Install independent PDF renderer on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Install independent PDF renderer on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v pdftoppm >/dev/null 2>&1; then
            brew install poppler
          fi
      - name: Type check and fixture tests
        run: |
          pnpm typecheck
          pnpm test
      - name: Production build
        run: pnpm build
      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Browser workflows
        run: pnpm test:e2e
      - name: Retain browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-evidence-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  core-and-signature-verification:
    name: Linux Chromium core and signatures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_BROWSER: chromium
      E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bound inactive Linux package downloads
        run: |
          printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/99folio-ci-download-limits
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies and prepare fixtures
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          python -m pip install pypdf==6.10.0 cryptography==50.0.1
          pnpm assets
          pnpm fixtures
          pnpm fixtures:fidelity
          pnpm exec playwright install --with-deps chromium
      - name: Verify controller save boundaries and PDF editing
        run: pnpm test:core
      - name: Verify signing and signature inspection
        run: pnpm exec playwright test --config tests/core/signing.config.ts
      - name: Retain core verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-signature-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
