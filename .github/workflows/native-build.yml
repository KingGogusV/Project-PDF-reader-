name: Experimental desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows development installer
            os: windows-latest
            bundles: nsis
            artifact: windows-nsis
          - name: macOS development application
            os: macos-latest
            bundles: app,dmg
            artifact: macos-app-dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CI: 'true'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Resolve native dependency lockfile
        working-directory: src-tauri
        shell: bash
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi
          cargo metadata --locked --format-version 1 > native-dependency-metadata.json
      - name: Build development native package
        # Invoke Node directly: pnpm's Windows wrapper consumes the Cargo separator.
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-sign --bundles ${{ matrix.bundles }} -- --locked
      - name: Archive macOS application preserving file permissions
        if: runner.os == 'macOS'
        run: tar -czf src-tauri/target/release/bundle/Folio-macos-app.tar.gz -C src-tauri/target/release/bundle/macos Folio.app
      - name: Retain exact native dependency resolution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-dependencies-${{ matrix.artifact }}-${{ github.run_id }}
          path: |
            src-tauri/Cargo.lock
            src-tauri/native-dependency-metadata.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload development installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: folio-development-${{ matrix.artifact }}-${{ github.run_id }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/Folio-macos-app.tar.gz
          if-no-files-found: error
          retention-days: 14
