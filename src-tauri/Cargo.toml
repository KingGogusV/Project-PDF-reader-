[package]
name = "folio-desktop"
version = "0.1.3"
description = "Experimental local Folio PDF reader wrapper"
publish = false
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "folio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = { version = "=2.7.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
uuid = { version = "=1.27.0", features = ["v4"] }
tempfile = "=3.27.0"
