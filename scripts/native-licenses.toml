# cargo-about 0.9.2; Windows release graph, including build-time provenance.
# The Node collector additionally enforces exact versions for MPL exceptions.
accepted = [
  "MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
  "Unlicense", "CC0-1.0", "0BSD", "Apache-2.0 WITH LLVM-exception",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }

# Unchanged original source archives are distributed for these file-level
# copyleft crates. This is not a blanket allowance for new copyleft dependencies.
[cssparser]
accepted = ["MPL-2.0"]
[cssparser-macros]
accepted = ["MPL-2.0"]
[dtoa-short]
accepted = ["MPL-2.0"]
[option-ext]
accepted = ["MPL-2.0"]
[selectors]
accepted = ["MPL-2.0"]

# These workspace crates omit their root MIT license from the published archive.
# The revision and original text checksum were inspected for the locked versions.
[webview2-com.clarify]
license = "MIT"
override-git-commit = "edc2caf886175ccaebe86078c9cfe1ae2a187328"
[[webview2-com.clarify.git]]
path = "LICENSE"
checksum = "0dcf41516e608bbcb6cdc5229feb7b86fe4a643b85e7df251133c93408fdac73"

[webview2-com-sys.clarify]
license = "MIT"
override-git-commit = "edc2caf886175ccaebe86078c9cfe1ae2a187328"
[[webview2-com-sys.clarify.git]]
path = "LICENSE"
checksum = "0dcf41516e608bbcb6cdc5229feb7b86fe4a643b85e7df251133c93408fdac73"

[webview2-com-macros.clarify]
license = "MIT"
override-git-commit = "dffa41a8a46d3f5565eefbff2de57d38d399f158"
[[webview2-com-macros.clarify.git]]
path = "LICENSE"
