# cargo-about 0.9.2; Windows release graph, including build-time provenance.
# The Node collector additionally enforces exact versions for MPL exceptions.
accepted = [
  "MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
  "Unlicense", "CC0-1.0", "0BSD", "Apache-2.0 WITH LLVM-exception",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }

# Unchanged original source archives are distributed for these file-level
# copyleft crates. This is not a blanket allowance for new copyleft dependencies.
[cssparser]
accepted = ["MPL-2.0"]
[cssparser-macros]
accepted = ["MPL-2.0"]
[dtoa-short]
accepted = ["MPL-2.0"]
[option-ext]
accepted = ["MPL-2.0"]
[selectors]
accepted = ["MPL-2.0"]

